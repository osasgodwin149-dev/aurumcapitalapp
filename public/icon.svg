<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c3e2f7" />
      <stop offset="100%" stop-color="#eaf3fa" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#efb224" />
      <stop offset="100%" stop-color="#d99812" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1c2534" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner white circular glow -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" filter="url(#shadow)" opacity="0.95" />

  <!-- Crown Icon -->
  <g transform="translate(106, 126)">
    <!-- Crown Base & Spikes -->
    <path d="M20 70 L60 210 L240 210 L280 70 L200 145 L150 40 L100 145 Z" fill="url(#goldGrad)" stroke="#c68a0a" stroke-width="8" stroke-linejoin="round" />
    <!-- Bottom base rim -->
    <rect x="55" y="222" width="190" height="26" rx="13" fill="url(#goldGrad)" stroke="#c68a0a" stroke-width="6" />
    <!-- Crown Jewels -->
    <circle cx="150" cy="180" r="14" fill="#23b574" stroke="#1b8a58" stroke-width="4" />
    <circle cx="95" cy="180" r="10" fill="#ffffff" stroke="#c68a0a" stroke-width="3" />
    <circle cx="205" cy="180" r="10" fill="#ffffff" stroke="#c68a0a" stroke-width="3" />
    <!-- Crown top tips -->
    <circle cx="20" cy="70" r="10" fill="#ffd54f" />
    <circle cx="150" cy="40" r="12" fill="#ffd54f" />
    <circle cx="280" cy="70" r="10" fill="#ffd54f" />
  </g>
</svg>
